
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganti Password Admin - SMA Katolik 1 Kabanjahe</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 420px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 15px #00000015;
        }

        h2 {
            color: #123b67;
            text-align: center;
        }

        p {
            color: #475569;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            background: #123b67;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>GANTI PASSWORD</h2>

        <p>
            SMA Swasta Katolik 1 Kabanjahe
        </p>

        <form id="updatePasswordForm">

            <input
                type="password"
                id="newPassword"
                placeholder="Masukkan password baru"
                minlength="8"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Ulangi password baru"
                minlength="8"
                required
            >

            <button type="submit" id="updateButton">
                SIMPAN PASSWORD BARU
            </button>

        </form>

        <p id="message"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="update-password.js"></script>

</body>
</html>
